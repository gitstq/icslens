[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icslens"
version = "1.0.0"
description = "Zero-dependency, offline-first iCalendar (RFC 5545) parser, recurrence expander & calendar health auditor — Python library + CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "gitstq" }]
keywords = [
    "icalendar", "ics", "rfc5545", "calendar", "rrule", "recurrence",
    "audit", "linter", "zero-dependency", "offline", "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/gitstq/icslens"
Repository = "https://github.com/gitstq/icslens"
Issues = "https://github.com/gitstq/icslens/issues"
Changelog = "https://github.com/gitstq/icslens/releases"

[project.scripts]
icslens = "icslens.cli:main"

[tool.setuptools]
packages = ["icslens"]
